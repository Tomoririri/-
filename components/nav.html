<!-- ============================================================
     nav.html —— 导航组件（从 header 里拆出来的独立版本）
     什么时候用：页面不需要站点 Logo，只想放一条导航；
                或者导航要换位置（比如侧栏）。
     用法：放在 <header> 里或独立使用；data-nav / data-nav-toggle
           两个钩子要成对出现，交互才会生效。
     ============================================================ -->
<nav class="site-nav" id="site-nav" data-nav aria-label="主导航">
  <ul class="site-nav__list">
    <li class="site-nav__item">
      <a class="site-nav__link" href="#about">关于我</a>
    </li>
    <li class="site-nav__item">
      <a class="site-nav__link" href="#skills">技能</a>
    </li>
    <li class="site-nav__item">
      <a class="site-nav__link" href="#works">作品</a>
    </li>
    <li class="site-nav__item">
      <a class="site-nav__link" href="#contact">联系</a>
    </li>
  </ul>
</nav>
