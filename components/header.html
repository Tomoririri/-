<!-- ============================================================
     header.html —— 页头组件（含导航）
     用法：整段引入到每个页面 <body> 顶部；
           样式在 css/common.css，交互在 js/common.js。
     语义：<header> 包住品牌与 <nav>，符合 HTML5 分区语义。
     ============================================================ -->
<header class="site-header">
  <div class="container site-header__inner">

    <!-- 品牌 / Logo -->
    <a class="site-header__logo" href="index.html" aria-label="返回首页">
      <span class="site-header__logo-mark" aria-hidden="true">韦</span>
      <span class="site-header__logo-text">韦林非凡</span>
    </a>

    <!-- 汉堡按钮：手机端显示，桌面端隐藏（CSS 控制） -->
    <button
      class="site-header__toggle"
      type="button"
      data-nav-toggle
      aria-expanded="false"
      aria-controls="site-nav"
      aria-label="打开导航菜单"
    >
      <span class="site-header__toggle-bar" aria-hidden="true"></span>
    </button>

    <!-- 导航：可独立拆成 nav.html -->
    <nav class="site-nav" id="site-nav" data-nav aria-label="主导航">
      <ul class="site-nav__list">
        <li class="site-nav__item">
          <a class="site-nav__link" href="index.html#about">关于我</a>
        </li>
        <li class="site-nav__item">
          <a class="site-nav__link" href="index.html#skills">技能</a>
        </li>
        <li class="site-nav__item">
          <a class="site-nav__link" href="index.html#works">作品</a>
        </li>
        <li class="site-nav__item">
          <a class="site-nav__link" href="index.html#contact">联系</a>
        </li>
      </ul>
      <a class="site-nav__cta" href="index.html#contact">联系我</a>
    </nav>

  </div>
</header>
